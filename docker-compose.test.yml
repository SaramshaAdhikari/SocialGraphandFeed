name: socialgraph-test

services:
  mongodb-test:
    image: mongo:7.0.14
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    ports:
      - "127.0.0.1:${MONGODB_TEST_HOST_PORT:-27018}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb-test:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis-test:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_TEST_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm ci && npm run test:backend"]
    environment:
      NODE_ENV: test
      MONGODB_TEST_URI: mongodb://mongodb-test:27017/?replicaSet=rs0&directConnection=true
      REDIS_TEST_URL: redis://redis-test:6379
      MONGODB_TEST_HOST_PORT: "27018"
      REDIS_TEST_HOST_PORT: "6380"
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    depends_on:
      mongodb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

volumes:
  test_node_modules:
