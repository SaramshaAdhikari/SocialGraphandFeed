services:
  mongodb:
    image: mongo:7.0
    container_name: socialgraph-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: socialgraph
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - socialgraph-network

  redis:
    image: redis:7.2-alpine
    container_name: socialgraph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - socialgraph-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  socialgraph-network:
    driver: bridge
