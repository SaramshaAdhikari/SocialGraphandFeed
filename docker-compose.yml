name: socialgraph

services:
  mongodb:
    image: mongo:7.0.14
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27027}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6387}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm run build --workspace=packages/shared && npm run dev --workspace=packages/backend"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-socialgraph}
      REDIS_URL: redis://redis:6379
      DEV_USER_BYPASS: "false"
      SESSION_SECRET: ${SESSION_SECRET:-development-only-session-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4000}:4000"
    volumes:
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm run dev --workspace=packages/frontend -- --host 0.0.0.0"]
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-live}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mongodb_data:
  redis_data:
