<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="alexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="url(#alexBg)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />
  <!-- Terminal window container -->
  <rect x="36" y="42" width="88" height="68" rx="8" fill="#18181b" stroke="#334155" stroke-width="2" />
  <!-- Terminal window top header bar -->
  <path d="M36 50 C36 45.6 39.6 42 44 42 L116 42 C120.4 42 124 45.6 124 50 L124 56 L36 56 Z" fill="#27272a" />
  <!-- Window buttons -->
  <circle cx="46" cy="49" r="3" fill="#ef4444" />
  <circle cx="54" cy="49" r="3" fill="#eab308" />
  <circle cx="62" cy="49" r="3" fill="#22c55e" />
  <!-- Code prompt: >_ -->
  <path d="M48 68 L58 76 L48 84" fill="none" stroke="url(#alexGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Blinking cursor -->
  <rect x="64" y="80" width="14" height="4" rx="2" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <!-- Terminal content lines -->
  <line x1="64" y1="68" x2="106" y2="68" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="96" x2="92" y2="96" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <!-- Coffee cup silhouette icon next to terminal -->
  <path d="M106 120 C106 126 112 128 118 128 C124 128 130 126 130 120 L132 108 L104 108 Z" fill="#38bdf8" opacity="0.85" />
  <path d="M130 112 C134 112 136 115 134 118 C132 121 130 121 129 121" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
</svg>
