<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="lucasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="url(#lucasBg)" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.35" />
  <!-- Distributed mesh connection lines -->
  <line x1="80" y1="42" x2="44" y2="72" stroke="#1e293b" stroke-width="2.5" />
  <line x1="80" y1="42" x2="116" y2="72" stroke="#1e293b" stroke-width="2.5" />
  <line x1="44" y1="72" x2="56" y2="118" stroke="#1e293b" stroke-width="2.5" />
  <line x1="116" y1="72" x2="104" y2="118" stroke="#1e293b" stroke-width="2.5" />
  <line x1="56" y1="118" x2="104" y2="118" stroke="#1e293b" stroke-width="2.5" />
  <!-- Central consensus mesh -->
  <line x1="80" y1="42" x2="80" y2="86" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" />
  <line x1="44" y1="72" x2="80" y2="86" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" />
  <line x1="116" y1="72" x2="80" y2="86" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" />
  <line x1="56" y1="118" x2="80" y2="86" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" />
  <line x1="104" y1="118" x2="80" y2="86" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="3 3" />
  <!-- Outer nodes -->
  <circle cx="80" cy="42" r="10" fill="url(#nodeGrad)" />
  <circle cx="44" cy="72" r="9" fill="url(#nodeGrad)" />
  <circle cx="116" cy="72" r="9" fill="url(#nodeGrad)" />
  <circle cx="56" cy="118" r="9" fill="url(#nodeGrad)" />
  <circle cx="104" cy="118" r="9" fill="url(#nodeGrad)" />
  <!-- Center hub node -->
  <circle cx="80" cy="86" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="80" cy="86" r="6" fill="#38bdf8" />
  <!-- Subtle inner node highlights -->
  <circle cx="78" cy="40" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="42" cy="70" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="114" cy="70" r="2.5" fill="#ffffff" opacity="0.6" />
</svg>
