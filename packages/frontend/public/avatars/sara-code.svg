<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="saraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="swatchRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="swatchViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="swatchAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="url(#saraBg)" stroke="#c084fc" stroke-width="3" stroke-opacity="0.4" />
  <!-- Design system layout grid lines -->
  <rect x="36" y="36" width="88" height="88" rx="12" fill="#1e1b4b" stroke="#6b21a8" stroke-width="2" />
  <line x1="80" y1="36" x2="80" y2="124" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="36" y1="80" x2="124" y2="80" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="3 3" />
  <!-- Overlapping geometric design token swatches -->
  <rect x="46" y="46" width="30" height="30" rx="8" fill="url(#swatchRose)" />
  <circle cx="98" cy="61" r="15" fill="url(#swatchAmber)" />
  <polygon points="61,95 46,118 76,118" fill="#06b6d4" />
  <rect x="83" y="88" width="30" height="30" rx="8" fill="url(#swatchViolet)" />
  <!-- Subgrid alignment marker -->
  <circle cx="80" cy="80" r="5" fill="#ffffff" />
</svg>
