# Render Blueprint for SocialGraphandFeed (public demo deployment).
# Web service: single-origin production server (frontend + /api proxy to backend).
# MongoDB is NOT provided by Render: set MONGODB_URI to a separate Atlas M0
# cluster (a new demo database, not the team's shared socialgraph-dev DB).
# Redis is provided by Render Key Value (free, cache only, non-persistent).
# Secrets are never committed: SESSION_SECRET is generated by Render and
# MONGODB_URI is set manually in the dashboard (sync: false).
services:
  - type: web
    name: socialgraph-feed
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: socialgraph
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromKeyValue:
          name: socialgraph-cache
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://socialgraph-feed.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_PROVIDER
        value: local

keyValues:
  - name: socialgraph-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
